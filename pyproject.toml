[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selfstack"
version = "0.1.0"
description = "自体系盘点 + 自主升级雷达：先摸清自己由什么组成，再定期去外面找哪些项目值得换进来"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["self-audit", "agent", "tooling", "upgrade-radar", "observability"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
selfstack = "selfstack.cli:main"

[tool.setuptools]
packages = ["selfstack"]
